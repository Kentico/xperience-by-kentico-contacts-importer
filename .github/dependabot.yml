# Kentico.Xperience.* and @kentico/* are updated with the update-xperience agent skill,
# which also regenerates examples/DancingGoat for the new version.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Kentico.Xperience.*"
    groups:
      # Bumps together; keep sdk.version in aspire.config.json in step
      aspire:
        patterns: ["Aspire.*", "CommunityToolkit.Aspire.*"]
      # Everything else in one pull request, majors included
      nuget:
        patterns: ["*"]

  # One entry for both npm folders: a group spans them, so each update is one pull request a week
  - package-ecosystem: npm
    directories:
      - /src/Kentico.Xperience.Labs.ContactsImporter.Admin/Client
      - /tests/e2e
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@kentico/*"
      # Must match the React version the Xperience admin ships
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Held back until @kentico/xperience-webpack-config supports them
      - dependency-name: "@babel/*"
        versions: [">=8"]
      # Held back for now (major rewrite; the admin client also needs @kentico/xperience-webpack-config support)
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # Majors too: fewer pull requests means fewer CI runs (see the merge queue note in docs/Contributing-Setup.md)
      npm:
        patterns: ["*"]

  # global.json pins the SDK exactly (see AGENTS.md). CI fails on this PR until the lock files are
  # regenerated with the new SDK: dotnet restore --force-evaluate
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
